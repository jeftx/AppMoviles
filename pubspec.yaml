name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  
  flutter_bloc: ^8.1.3
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  firebase_ai: ^5.1.0
  image_picker: ^1.2.4
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_food.jpg
    - assets/images/meal_breakfast.jpg
    - assets/images/meal_lunch.jpg
    - assets/images/meal_snack.jpg
    - assets/images/meal_dinner.jpg
